<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Mars 3D</title>
<script>window.CESIUM_BASE_URL = 'https://cdn.jsdelivr.net/npm/cesium@1.120.0/Build/Cesium/';</script>
<script src="https://cdn.jsdelivr.net/npm/cesium@1.120.0/Build/Cesium/Cesium.js"></script>
<link href="https://cdn.jsdelivr.net/npm/cesium@1.120.0/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
<style>html,body,#map{margin:0;height:100%;background:#000}
.craft-label{position:absolute;left:0;top:0;cursor:pointer;white-space:nowrap}
#info{position:absolute;top:50px;left:10px;z-index:2;width:300px;padding:12px;background:#111d;color:#eee;
  font:14px/1.4 sans-serif;border:1px solid #555;border-radius:6px}
#info h3{margin:0 0 6px}#info a{color:#8cf}#info button{margin:8px 6px 0 0;padding:5px 9px}
#toggle{position:absolute;top:10px;left:10px;z-index:1;padding:6px 10px;font:14px sans-serif}</style>
</head>
<body>
<div id="map"></div>
<button id="toggle">Flat map</button>
<button id="marsinfo" style="position:absolute;top:10px;left:240px;z-index:1;padding:6px 10px;font:14px sans-serif">About Mars</button>
<div id="info" style="display:none"><h3></h3><p></p>
  <button id="view">View closely</button><button id="close">Close</button>
  <a target="_blank">NASA mission page</a></div>
<button id="eye" style="position:absolute;top:10px;left:120px;z-index:1;padding:6px 10px;font:14px sans-serif">Back to orbit</button>
<script src="traverses.js"></script>
<script src="moons.js"></script>
<script>
// Mars IAU radii (m)
const mars = new Cesium.Ellipsoid(3396190, 3396190, 3376200);
Cesium.Ellipsoid.default = mars;

const trek = layer => new Cesium.UrlTemplateImageryProvider({
  url: `https://trek.nasa.gov/tiles/Mars/EQ/${layer}/1.0.0/default/default028mm/{z}/{y}/{x}.jpg`,
  tilingScheme: new Cesium.GeographicTilingScheme({ ellipsoid: mars }),
  maximumLevel: 7,
  credit: 'NASA Mars Trek',
});

const viewer = new Cesium.Viewer('map', {
  globe: new Cesium.Globe(mars),
  baseLayer: new Cesium.ImageryLayer(trek('Mars_Viking_MDIM21_ClrMosaic_global_232m')),
  baseLayerPicker: false, geocoder: false, timeline: false, animation: false,
  skyAtmosphere: false, infoBox: false, selectionIndicator: false, // infoBox iframe crashes on file://
});
// MOLA hillshade over the color mosaic for relief
const shade = viewer.imageryLayers.addImageryProvider(trek('Mars_MGS_MOLA_ClrShade_merge_global_463m'));
shade.alpha = 0.4;

// Real 3D Mars relief: Cesium ion "Cesium Mars" 3D Tiles; replaces the flat globe while shown
Cesium.Ion.defaultAccessToken = 'YOUR_CESIUM_ION_TOKEN';
let terrain;
Cesium.Cesium3DTileset.fromIonAssetId(3644333).then(t => {
  terrain = viewer.scene.primitives.add(t);
  viewer.scene.globe.show = false;
}).catch(err => console.error('Mars terrain failed, staying on flat map', err));

const NASA3D = n => `https://raw.githubusercontent.com/nasa/NASA-3D-Resources/master/3D%20Models/${encodeURIComponent(n)}/${encodeURIComponent(n)}.glb`;
const pins = [];

// Rovers: landing site = first traverse point, path = full NASA traverse (traverses.js)
// ponytail: traverses.js is a snapshot; re-run the download when the rovers move on
const rovers = [
  ['Curiosity – Gale Crater', 'MSL', 'ORANGE', 'https://science.nasa.gov/mission/msl-curiosity/'],
  ['Perseverance – Jezero Crater', 'M20', 'CYAN', 'https://science.nasa.gov/mission/mars-2020-perseverance/'],
];
for (const [name, key, col, link] of rovers) {
  const p = TRAVERSES[key].pts, color = Cesium.Color[col];
  viewer.entities.add({
    polyline: { positions: Cesium.Cartesian3.fromDegreesArray(p, mars), width: 3, material: color,
                clampToGround: true },
  });
  const pin = (label, i, size, model) => pins.push(viewer.entities.add({
    name: label, position: Cesium.Cartesian3.fromDegrees(p[i], p[i + 1], 0, mars),
    carto: Cesium.Cartographic.fromDegrees(p[i], p[i + 1], 0),
    point: model ? undefined : { pixelSize: size, color, outlineColor: Cesium.Color.BLACK, outlineWidth: 1,
                                 disableDepthTestDistance: Infinity },
    // ponytail: no NASA Curiosity glTF exists, so both rovers use the Perseverance model (same chassis)
    model: model && { uri: NASA3D('Mars 2020 Perseverance Rover'), minimumPixelSize: 24 },
    label: { text: label, font: '13px sans-serif', pixelOffset: new Cesium.Cartesian2(0, -24),
             disableDepthTestDistance: Infinity,
             distanceDisplayCondition: new Cesium.DistanceDisplayCondition(0, 2e7) },
    properties: { link },
  }));
  pin(`${name} landing site`, 0, 12);
  pin(`${name.split(' ')[0]} now`, p.length - 2, 8, true);
}
// Every 20 frames, set each rover pin on the terrain as currently rendered (tracks LOD changes)
let frame = 0;
viewer.scene.postRender.addEventListener(scene => {
  if (!terrain?.show || frame++ % 20) return;
  for (const e of pins) {
    const h = scene.sampleHeight(e.carto, pins);
    if (h !== undefined) e.position = Cesium.Cartesian3.fromRadians(e.carto.longitude, e.carto.latitude, h, mars);
  }
});

// Info panel: click any body/craft/rover (or its label) for facts + a close-up view
const INFO = {
  Mars: 'Fourth planet from the Sun. Radius 3,390 km, day 24 h 37 min, year 687 Earth days. Home to Olympus Mons (~22 km high) and Valles Marineris (~4,000 km long).',
  Phobos: 'Larger of Mars\'s two moons, ~22 km across. Orbits every 7 h 39 min, faster than Mars turns, and is slowly spiralling inward.',
  Deimos: 'Smaller, outer moon, ~12 km across. Orbits every 30.3 hours.',
  'Mars Reconnaissance Orbiter': 'NASA orbiter, at Mars since 2006. Its HiRISE camera sees objects ~30 cm across; also relays rover data to Earth.',
  'Mars Odyssey': 'NASA orbiter, at Mars since 2001, the longest-working Mars spacecraft. Mapped water ice below the surface.',
  MAVEN: 'NASA orbiter, at Mars since 2014. Studies how Mars lost its atmosphere to space.',
  'Mars Express': 'ESA orbiter, at Mars since 2003. Its HRSC camera maps the planet in 3D colour.',
  'ExoMars TGO': 'ESA–Roscosmos Trace Gas Orbiter, at Mars since 2016. Hunts for methane and other trace gases.',
  Curiosity: 'NASA rover, landed 6 Aug 2012 in Gale Crater. Nuclear-powered, climbing Mount Sharp to read Mars\'s climate history in its rock layers.',
  Perseverance: 'NASA rover, landed 18 Feb 2021 in Jezero Crater, an ancient lake delta. Seeks signs of past life and stores rock samples for return to Earth.',
};
const info = document.getElementById('info');
let shown;
function showInfo(entity) {
  shown = entity;
  const name = entity?.name ?? 'Mars';
  info.querySelector('h3').textContent = name;
  info.querySelector('p').textContent = INFO[Object.keys(INFO).find(k => name.startsWith(k))] ?? '';
  const link = entity?.properties?.link?.getValue();
  info.querySelector('a').style.display = link ? '' : 'none';
  if (link) info.querySelector('a').href = link;
  info.style.display = '';
}
document.getElementById('close').onclick = () => { info.style.display = 'none'; viewer.trackedEntity = undefined; };
document.getElementById('view').onclick = () => {
  if (!shown) return viewer.camera.flyHome();
  if (pins.includes(shown)) // rover: fly to a 40 m view; tracking a ground point would fight the terrain clamp
    viewer.flyTo(shown, { offset: new Cesium.HeadingPitchRange(0, -0.35, 40) });
  else viewer.trackedEntity = shown; // orbiting body: camera follows it
};
document.getElementById('marsinfo').onclick = () => showInfo(null);

// Ground mode: click the surface -> stand there at eye height, drag to look around
const eye = document.getElementById('eye');
let ground = false, orbitView;
const ssc = viewer.scene.screenSpaceCameraController;
function setGround(on) {
  ground = on;
  ssc.enableRotate = ssc.enableZoom = ssc.enableTilt = ssc.enableTranslate = !on;
  ssc.lookEventTypes = on ? Cesium.CameraEventType.LEFT_DRAG
                          : { eventType: Cesium.CameraEventType.LEFT_DRAG, modifier: Cesium.KeyboardEventModifier.SHIFT };
  eye.style.display = on ? '' : 'none';
}
setGround(false);
eye.onclick = () => { setGround(false); viewer.camera.flyTo(orbitView); };

// WASD walk (Shift = run); each frame keep the eye 1.7 m above the ground currently rendered
const keys = new Set();
addEventListener('keydown', e => keys.add(e.code));
addEventListener('keyup', e => keys.delete(e.code));
let last = performance.now();
viewer.scene.preRender.addEventListener(scene => {
  const now = performance.now(), dt = (now - last) / 1000;
  last = now;
  if (!ground) return;
  const cam = scene.camera, step = (keys.has('ShiftLeft') || keys.has('ShiftRight') ? 100 : 10) * dt; // m/s: walk, Shift = run
  if (keys.has('KeyW')) cam.moveForward(step);
  if (keys.has('KeyS')) cam.moveBackward(step);
  if (keys.has('KeyA')) cam.moveLeft(step);
  if (keys.has('KeyD')) cam.moveRight(step);
  const c = Cesium.Cartographic.fromCartesian(cam.positionWC, mars);
  // ponytail: flat-map mode has no relief, so ground height is 0 there
  const h = terrain?.show ? scene.sampleHeight(c) : 0;
  if (h === undefined) return; // tiles not drawn here yet; retry next frame
  cam.setView({
    destination: Cesium.Cartesian3.fromRadians(c.longitude, c.latitude, h + 1.7, mars),
    orientation: { heading: cam.heading, pitch: cam.pitch, roll: 0 },
  });
});

// Click: named object -> info panel; anywhere else on Mars -> land there
viewer.screenSpaceEventHandler.setInputAction(e => {
  if (ground) return;
  const p = viewer.scene.pick(e.position);
  if (p?.id?.name) return showInfo(p.id);
  viewer.trackedEntity = undefined;
  const hit = terrain?.show ? viewer.scene.pickPosition(e.position)
                            : viewer.camera.pickEllipsoid(e.position, mars);
  if (!hit) return;
  const c = Cesium.Cartographic.fromCartesian(hit, mars);
  orbitView = { destination: viewer.camera.positionWC.clone(),
                orientation: { heading: viewer.camera.heading, pitch: viewer.camera.pitch, roll: 0 } };
  viewer.camera.flyTo({
    // land a bit high: the clicked height is from coarse orbit tiles; ground mode then settles to 1.7 m
    destination: Cesium.Cartesian3.fromRadians(c.longitude, c.latitude, c.height + 50, mars),
    orientation: { heading: 0, pitch: 0, roll: 0 },
    duration: 4, complete: () => setGround(true),
  });
}, Cesium.ScreenSpaceEventType.LEFT_CLICK);

// Sun lighting: day side bright, night side dark
viewer.scene.globe.enableLighting = true;
viewer.scene.light = new Cesium.SunLight({ intensity: 2.5 });
viewer.clock.shouldAnimate = true;
viewer.clock.multiplier = 1; // real-time speed

// Moons + orbiters: [name, altitude km, period h, inclination deg, node deg, color, shape]
// shape: moon radii in m (true-size ellipsoid), NASA model name, or nothing (dot only)
// ponytail: circular orbits fixed in Mars frame, models unoriented; use SPICE/Horizons if accuracy matters
const R = 3389.5;
const bodies = [
  ['Phobos', 9376 - R, 7.654, 1.1, 0, 'WHITE', [13000, 11400, 9100]],
  ['Deimos', 23463 - R, 30.31, 1.8, 40, 'LIGHTGRAY', [7800, 6000, 5100]],
  ['Mars Reconnaissance Orbiter', 300, 1.87, 93, 10, 'CYAN', 'Mars Reconnaissance Orbiter (MRO) (A)'],
  ['Mars Odyssey', 400, 1.97, 93, 100, 'ORANGE', 'Mars Odyssey'],
  ['MAVEN', 3000, 4.5, 75, 200, 'LIME', 'Mars Atmosphere and Volatile EvolutioN (MAVEN) (A)'],
  ['Mars Express', 4000, 7.0, 86, 280, 'MAGENTA'],
  ['ExoMars TGO', 400, 2.0, 74, 160, 'GOLD'],
];
// MOON_MAPS (moons.js): Phobos/Deimos surface photo maps wrapped onto their ellipsoids
// ponytail: moons aren't rotated to face Mars (tidally locked), so the visible side is arbitrary
const orbital = [];
const labels = []; // [entity, div]: HTML text labels, since Cesium's Label renderer left speckles around glyphs
const t0 = Cesium.JulianDate.clone(viewer.clock.currentTime);
for (const [name, alt, period, inc, node, col, shape] of bodies) {
  const natural = Array.isArray(shape);
  const r = (R + alt) * 1000, i = inc * Math.PI / 180, O = node * Math.PI / 180;
  const at = a => new Cesium.Cartesian3(
    r * (Math.cos(O) * Math.cos(a) - Math.sin(O) * Math.sin(a) * Math.cos(i)),
    r * (Math.sin(O) * Math.cos(a) + Math.cos(O) * Math.sin(a) * Math.cos(i)),
    r * Math.sin(a) * Math.sin(i));
  const color = Cesium.Color[col];
  orbital.push(viewer.entities.add({
    name,
    position: new Cesium.CallbackProperty(t =>
      at(2 * Math.PI * Cesium.JulianDate.secondsDifference(t, t0) / (period * 3600)), false),
    point: shape ? undefined : { pixelSize: 7, color },
    ellipsoid: natural ? { radii: new Cesium.Cartesian3(...shape), material: Cesium.Color.GRAY } : undefined,
    model: typeof shape === 'string' ? { uri: NASA3D(shape), minimumPixelSize: 40 } : undefined,
  }));
  if (natural) { // wrap the moon photo map on once the decoded image element is ready
    const moon = orbital.at(-1), img = new Image();
    img.onload = () => moon.ellipsoid.material = new Cesium.ImageMaterialProperty({ image: img });
    img.onerror = () => console.error(`${name} photo map failed to load`);
    img.src = MOON_MAPS[name];
  }
  const div = document.createElement('div');
  div.className = 'craft-label';
  div.textContent = name;
  const body = orbital.at(-1);
  div.onclick = () => showInfo(body);
  div.style.color = color.toCssColorString();
  div.style.font = natural ? 'bold 14px sans-serif' : '12px sans-serif';
  document.body.appendChild(div);
  labels.push([orbital.at(-1), div]);
  orbital.push(viewer.entities.add({
    polyline: { positions: Array.from({ length: 121 }, (_, k) => at(k * Math.PI / 60)),
                width: 1, material: Cesium.Color.WHITE.withAlpha(0.5), arcType: Cesium.ArcType.NONE },
  }));
}

// Each frame: place every HTML label above its craft, hidden when Mars is in the way
viewer.scene.postRender.addEventListener((scene, time) => {
  const occluder = new Cesium.EllipsoidalOccluder(mars, scene.camera.positionWC);
  for (const [entity, div] of labels) {
    const p = entity.position.getValue(time);
    const s = occluder.isPointVisible(p) && Cesium.SceneTransforms.wgs84ToWindowCoordinates(scene, p);
    div.style.display = s ? '' : 'none';
    if (s) div.style.transform = `translate(${s.x}px, ${s.y - 10}px) translate(-50%, -100%)`;
  }
});

// Toggle: switch between 3D terrain and the flat Viking + MOLA map
document.getElementById('toggle').onclick = e => {
  if (!terrain) return;
  terrain.show = !terrain.show;
  viewer.scene.globe.show = !terrain.show;
  e.target.textContent = terrain.show ? 'Flat map' : '3D terrain';
};
</script>
<script>setTimeout(()=>{viewer.trackedEntity=orbital.find(e=>e.name==="Phobos")},2000)</script></body>
</html>
