<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>M.A.R.S. 2.0 — Mars Operations Platform</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#061018;--panel:rgba(7,20,29,.8);--line:rgba(88,218,239,.4);--cyan:#69eaff;--amber:#ffb45c;--red:#ff5a4f;--green:#8ce6a0;--text:#e5f7fa;--muted:#8db4bf}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}
#world{position:fixed;inset:0;width:100%;height:100%;border:0;background:#000}
.top{position:fixed;z-index:5;left:14px;right:14px;top:max(10px,env(safe-area-inset-top));display:flex;justify-content:space-between;align-items:center;pointer-events:none;gap:8px}
.top h1{margin:0;font-size:17px;letter-spacing:4px;color:var(--cyan)}.top small{display:block;font-size:8px;letter-spacing:2px;color:var(--muted);margin-top:2px}
.pill{border:1px solid var(--line);background:var(--panel);padding:7px 10px;border-radius:3px;font-size:10px;letter-spacing:1px;color:var(--muted);margin-left:6px;display:inline-block}.pill b{color:var(--cyan)}
button{border:1px solid var(--line);background:rgba(5,18,26,.9);color:var(--cyan);padding:8px 10px;border-radius:3px;font-size:10px;letter-spacing:1px;cursor:pointer}
button:hover{background:rgba(35,153,177,.25);border-color:var(--cyan)}button:focus-visible{outline:2px solid var(--amber)}
.ctl{position:fixed;z-index:6;left:50%;bottom:max(10px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:6px;flex-wrap:wrap;justify-content:center;width:min(1000px,calc(100% - 20px))}
.note{font-size:9px;color:var(--muted);line-height:1.45}
.mb{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;padding:16px}.mb.open{display:flex}
.modal{width:min(780px,100%);max-height:84vh;overflow:auto;background:rgba(5,17,25,.97);border:1px solid var(--line);border-radius:5px;padding:16px}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.mh h2{margin:0;font-size:14px;letter-spacing:2px;color:var(--cyan)}
.g{display:grid;grid-template-columns:1fr 1fr;gap:9px}.card{padding:11px;border:1px solid rgba(105,234,255,.2);background:rgba(13,37,48,.55);border-radius:4px;font-size:11px;line-height:1.55;color:#bdd4d9}.card h3{margin:0 0 6px;font-size:11px;letter-spacing:1px;color:var(--amber)}.card strong{color:var(--text)}.card.k{cursor:pointer}.card.k:hover{border-color:var(--cyan)}
#gmap{width:100%;display:block;background:#1a0f0b;border:1px solid var(--line);cursor:pointer}
@media(max-width:680px){.pill:nth-child(n+2){display:none}.g{grid-template-columns:1fr}button{padding:7px 8px;font-size:9px}}
/* outland entrance: splash, main menu, orange pause box */
.logo{background:#000;border:1px solid #fff;display:block}
#splash{position:fixed;inset:0;z-index:100;background:#000;display:flex;align-items:center;justify-content:center;transition:opacity .8s}
#splash img{width:min(42vmin,380px);animation:fi 2.5s both}@keyframes fi{0%{opacity:0;transform:scale(.94)}30%,75%{opacity:1;transform:none}100%{opacity:0}}
#menu{position:fixed;inset:0;z-index:30;background:linear-gradient(90deg,rgba(0,0,0,.72),transparent 62%)}#menu.off,#pause.off{display:none}
#menu .logo{position:absolute;left:max(22px,5vw);top:max(22px,4vh);width:min(16vmin,140px)}
#mbtn{position:absolute;left:max(22px,5vw);top:50%;transform:translateY(-36%)}
#mbtn button{display:block;background:none;border:0;color:#fff;font:700 clamp(28px,4.8vw,54px)/1.2 Rajdhani,sans-serif;cursor:pointer;text-shadow:0 2px 16px #000;transition:.2s;text-align:left;padding:0;letter-spacing:0}
#mbtn button:hover{color:var(--amber);transform:translateX(12px);background:none}#mbtn button:disabled{opacity:.3;pointer-events:none}
.or{border:3px solid #130703;border-radius:28px;background:linear-gradient(135deg,#ff8c00,#ff5e14 58%,#a93519);box-shadow:0 10px 36px rgba(0,0,0,.65)}
#pause{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:rgba(150,60,15,.28);backdrop-filter:blur(12px) saturate(1.2)}
#pause .or{padding:26px 56px;text-align:center}
#pause button{display:block;width:100%;background:none;border:0;color:#fff;font:700 clamp(24px,4.4vw,40px)/1.3 Rajdhani,sans-serif;cursor:pointer;text-shadow:0 2px 4px rgba(0,0,0,.35);padding:0;letter-spacing:0}#pause button:hover{transform:scale(1.06);background:none}
/* the outland game frame: menu backdrop (bg) or full screen (play) */
#loc3d{position:fixed;inset:0;width:100%;height:100%;border:0;z-index:50;display:none;background:#000}#loc3d.bg{display:block;z-index:20;pointer-events:none}#loc3d.play{display:block}
body.mm .top,body.mm .ctl{display:none}
</style></head><body>
<iframe id="world" src="3d map/mars3d.html" title="Real 3D Mars: Cesium Mars terrain with NASA Trek imagery"></iframe>
<header class="top"><div><h1>M.A.R.S. 2.0</h1><small>MARS OPERATIONS &amp; EXPLORATION PLATFORM</small></div><div><span class="pill"><b>SYSTEM ONLINE</b></span><span class="pill">SOL <b id="sol">001</b></span><span class="pill">LMST JEZERO <b id="lmst">--:--</b></span><span class="pill">SEASON <b id="lsr">--</b></span></div></header>
<nav class="ctl"><button id="bFam">FAMOUS LOCATIONS 3D</button><button id="bSites">LANDING SITES</button><button id="bMap">GLOBAL MAP (G)</button><button id="bOrb">ORBITS</button><button id="bDb">DATABASE</button><button id="bTime">TIME ×1</button><button id="bMenu">MENU (ESC)</button></nav>
<div class="mb" id="mb" role="dialog" aria-modal="true"><div class="modal"><div class="mh"><h2 id="mt"></h2><button id="mx" aria-label="Close">×</button></div><div id="mc"></div></div></div>
<div id="splash"><img class="lg" alt=""></div><div id="menu"><img class="lg logo" alt="OUTLAND"><nav id="mbtn"></nav></div><div id="pause" class="off"><div class="or" id="pbtn"></div></div>
<script src="3d map/storms.js"></script><script src="3d map/sites.js"></script>
<script>
(()=>{"use strict";
const $=i=>document.getElementById(i),D2R=Math.PI/180;
const fll=p=>Math.abs(p.lat).toFixed(4)+"°"+(p.lat<0?"S":"N")+" "+(+p.lon).toFixed(4)+"°E";
// ---- mission clock: M.sim seconds (1800 s = one sol) at TIME ×spd; it runs only while the orbit map is open
const M={sim:600,spd:1},SPEEDS=[1,5,25,100],G={started:false,menu:true,paused:true};
const BASE={lat:18.4447,lon:77.4508}; // Perseverance's landing site: local time and sunlight are given for it
// ---- storms: the real MDAD record (3d map/storms.js), one Mars sol per mission sol from MY28 Ls 255° (the 2007 global storm)
const Ts=STORMS[0][0],T0=4*360+255,Tn=STORMS[STORMS.length-1][0],WX={T:0,act:[],key:""},myLs=T=>"MY"+(24+Math.floor(T/360))+" Ls "+(T%360).toFixed(0)+"°";
function wxUpd(){const T=WX.T=Ts+(T0-Ts+M.sim/1800*360/668.6)%(Tn-Ts);WX.act=stormsAt(T);
 const k=WX.act.map(s=>s[4]).join();if(k!=WX.key&&m3ok){WX.key=k;to3d({type:"storms",date:myLs(T),list:WX.act.map(s=>[s[1],s[2],s[3],s[4],s[5]])})}}
// ---- Sun: season Ls from the storm replay date, declination from Mars's 25.19° tilt, hour angle from local solar time
const lmst=lon=>(((M.sim/1800)*24+(lon-BASE.lon)/15)%24+24)%24;
function sunAt(lat,lon){const Ls=(WX.T%360)*D2R,dec=Math.asin(Math.sin(25.19*D2R)*Math.sin(Ls)),lm=lmst(lon),H=(lm-12)*15*D2R,sl=lon*D2R-H;
 return{dec,sl,lm,vec:[Math.cos(dec)*Math.cos(sl),Math.cos(dec)*Math.sin(sl),Math.sin(dec)]}}
// ---- data
const SITES=`Viking 1|NASA|1976-07-20|Chryse Planitia|22.5|-48|First successful Mars lander; long-duration surface weather and imaging, biology experiments.
Viking 2|NASA|1976-09-03|Utopia Planitia|47.7|134.3|Returned images of frost and ran biology tests; orbiter mapped candidate sites.
Pathfinder|NASA|1997-07-04|Ares Vallis|19.1|-33.2|Airbag landing with Sojourner, the first rover on Mars.
Spirit|NASA|2004-01-04|Gusev Crater|-14.6|175.5|MER-A; found evidence of past water-altered rocks and silica-rich soil.
Opportunity|NASA|2004-01-25|Meridiani Planum|-2|-5.5|MER-B; found hematite concretions and sulfate rocks formed in water; operated ~14 years.
Phoenix|NASA|2008-05-25|Vastitas Borealis|68.2|-125.7|Dug into the arctic soil and confirmed shallow water ice; detected perchlorate.
Curiosity|NASA|2012-08-06|Gale Crater|-4.6|137.4|Found an ancient habitable lake environment at Yellowknife Bay; climbing Mount Sharp.
InSight|NASA|2018-11-26|Elysium Planitia|4.5|135.6|Seismometer recorded marsquakes and probed the crust, mantle and core.
Perseverance|NASA|2021-02-18|Jezero Crater|18.4|77.5|Astrobiology rover caching samples in an ancient river delta; flew Ingenuity helicopter.`.split("\n").map(l=>l.split("|"));
const SPOTS=`Jezero Crater|18.4|77.5|Ancient lake basin with a river delta.|Delta sediments, carbonates, clays.|Perseverance sample caching for Mars Sample Return.|Organic-bearing mudstones and delta deposits.
Gale Crater|-5.4|137.8|150 km crater with a 5 km central mound (Mount Sharp).|Layered sulfates and clays recording climate change.|Curiosity's field site.|Habitable lake environment and organic molecules.
Valles Marineris|-14|-59|Canyon system over 4,000 km long.|Exposed layered crust, tectonic rifting.|Target for hydrated minerals and sediment studies.|Seen from orbit; layered sulfate deposits.
Olympus Mons|18.65|-133.8|Tallest known volcano in the Solar System (~22 km).|Basaltic shield volcano.|Probes volcanic history and interior heat.|Orbiter altimetry and imaging.
Arcadia Planitia|47|-170|Smooth northern lowland plain.|Young lava and sediment cover.|Candidate for shallow ice.|Mid-latitude ice exposed in fresh craters.
Elysium Planitia|3|147|Volcanic plain with Elysium Mons.|Lava plains with recent marsquake activity.|InSight landed here.|Marsquakes and Cerberus Fossae activity.
Polar Ice Caps|90|0|Layered deposits of water ice and CO₂ frost.|Layered ice recording climate cycles.|Water and climate archive.|Radar sounding detected thick ice layers.`.split("\n").map(l=>l.split("|"));
const MOONS=[["Phobos","9,376 km (orbit radius)","7 h 39 min","22.2 km","2.14 km/s","Heavily cratered, spiraling slowly inward toward Mars."],["Deimos","23,463 km (orbit radius)","30 h 18 min","12.4 km","1.35 km/s","Smoother surface; slowly drifting outward."]];
const ORBS=[["Mars Reconnaissance Orbiter","NASA · 2006","High-resolution imaging (HiRISE), subsurface radar, climate monitoring."],["MAVEN","NASA · 2014","Studies upper atmosphere and loss of gas to space."],["Mars Odyssey","NASA · 2001","Longest-serving Mars orbiter; THEMIS mapping, detected hydrogen (ice) signatures; relay for rovers."],["ExoMars Trace Gas Orbiter","ESA/Roscosmos · 2016","Measures trace gases such as methane; relay for rovers."]];
// ---- NASA Trek global imagery tiles (geographic tiling: level z has 2^(z+1) × 2^z tiles of 180/2^z degrees)
const tiles={};let gmDraw=null;
function tile(z,y,x){const u=`https://trek.nasa.gov/tiles/Mars/EQ/Mars_Viking_MDIM21_ClrMosaic_global_232m/1.0.0/default/default028mm/${z}/${y}/${x}.jpg`;if(!tiles[u]){const i=tiles[u]=new Image();i.onload=()=>gmDraw&&gmDraw();i.src=u}return tiles[u]}
// Draw the whole planet at tile level 1 into g with X(lon)/Y(lat) → px
function trek(g,X,Y){for(let y=0;y<2;y++)for(let x=0;x<4;x++){const im=tile(1,y,x);if(im.complete&&im.naturalWidth)g.drawImage(im,X(-180+x*90),Y(90-y*90),X(-90+x*90)-X(-180+x*90),Y(-y*90)-Y(90-y*90))}}
// ---- modal
const mb=$("mb");function openM(t,h){$("mt").textContent=t;$("mc").innerHTML=h;mb.classList.add("open")}function closeM(){mb.classList.remove("open");$("mc").innerHTML="";gmDraw=null}
$("mx").onclick=closeM;mb.onclick=e=>{if(e.target==mb)closeM()};
const card=(h,p,k)=>`<div class="card ${k?"k":""}" ${k?`data-k="${k}"`:""}><h3>${h}</h3>${p}</div>`;
const flyB=(lat,lon,t="VIEW ON MAP")=>`<button data-fly="${lat},${lon}" style="margin-top:6px">${t}</button>`;
// TRAVEL button into the outland game at the famous location whose name contains n, or ""
const trvB=n=>{const s=SITES3D.find(t=>t.name.toLowerCase().includes(n.toLowerCase()));return s?` <button data-trv="${s.id}" style="margin-top:6px">TRAVEL THERE</button>`:""};
function sites(){openM("LANDING SITES",`<div class="g">${SITES.map(s=>card(s[0].toUpperCase()+" · "+s[1],`<strong>${s[2]}</strong> · ${s[3]}<br>${s[4]}°, ${s[5]}°E<br>${s[6]}<br>${flyB(s[4],s[5],"VIEW + SURVEY")}${trvB(s[0])}`)).join("")}</div><p class="note" style="margin-top:8px">VIEW flies the orbit map there and runs a survival survey; TRAVEL walks you onto the full 3D model of the site.</p>`)}
function db(){openM("MARS DATABASE",`<div class="g">${SPOTS.map(s=>card(s[0].toUpperCase(),`<strong>Description:</strong> ${s[3]}<br><strong>Geology:</strong> ${s[4]}<br><strong>Relevance:</strong> ${s[5]}<br><strong>Discoveries:</strong> ${s[6]}<br>${flyB(s[1],s[2])}${trvB(s[0])}`)).join("")}</div>`)}
function famous(){openM("FAMOUS LOCATIONS · REAL 3D TERRAIN",`<div class="g">${SITES3D.map(s=>card(s.name.toUpperCase(),`<strong>${fll(s)}</strong> · ${s.h} m<br>${s.desc}<br><button data-trv="${s.id}" style="margin-top:6px">TRAVEL THERE</button> <button data-fly="${s.lat},${s.lon},60000" style="margin-top:6px">VIEW FROM ORBIT</button>`)).join("")}</div><p class="note" style="margin-top:8px">TRAVEL walks you onto a full 3D model of the place: NASA MOLA laser altimetry with Mars curvature, outland graphics, rovers where NASA last tracked them and real dust storms.</p>`)}
function orbits(){openM("MOONS & ORBITERS",`<div class="g">${MOONS.map(m=>card(m[0].toUpperCase(),`Distance: <strong>${m[1]}</strong><br>Period: <strong>${m[2]}</strong><br>Diameter: <strong>${m[3]}</strong><br>Velocity: <strong>${m[4]}</strong><br>${m[5]}`,"o"+m[0])).join("")}${ORBS.map(o=>card(o[0].toUpperCase(),`<strong>${o[1]}</strong><br>${o[2]}`,"o"+o[0].replace("Trace Gas Orbiter","TGO"))).join("")}</div><p class="note" style="margin-top:8px">Click a moon or orbiter to follow it on the 3D map. Orbits run on mission time.</p>`)}
// Clicks in the modal: data-fly="lat,lon[,alt]" (orbit map there; survey unless alt given), data-trv="<site id>" (outland game there), data-k="o<name>" (follow orbiting body)
mb.addEventListener("click",e=>{const f=e.target.dataset.fly,v=e.target.dataset.trv;
 if(f){const[a,b,c]=f.split(",");closeM();if(!G.started)startMap();return to3d({type:"fly",lat:+a,lon:+b,alt:c?+c:undefined,survey:!c})}
 if(v)return travel(v);
 const c=e.target.closest("[data-k]");if(c){closeM();if(!G.started)startMap();to3d({type:"track",name:c.dataset.k.slice(1)})}});
// Global map: NASA Trek Viking mosaic, real day/night terminator and real dust storms (MDAD) for the current mission time
function gmap(){openM("GLOBAL MARS MAP",`<canvas id="gmap" width="720" height="360"></canvas><div id="gi" class="note" style="margin-top:8px;font-size:11px">Click anywhere. Cyan = landing sites, amber = science hotspots, orange = real dust storms now (MDAD). Shaded = night.</div>`);
 const c=$("gmap"),g=c.getContext("2d"),W=720,H=360,px=l=>(l+180)/360*W,py=l=>(90-l)/180*H;
 const pts=[...SITES.map(s=>[+s[4],+s[5],s[0],"#69eaff",s[6]]),...SPOTS.map(s=>[+s[1],+s[2],s[0],"#ffb45c",s[3]+" "+s[5]])];
 (gmDraw=()=>{g.fillStyle="#3a1d12";g.fillRect(0,0,W,H);trek(g,px,py);
  g.strokeStyle="rgba(0,0,0,.2)";for(let i=0;i<=360;i+=30){g.beginPath();g.moveTo(px(i-180),0);g.lineTo(px(i-180),H);g.stroke()}for(let i=-60;i<=60;i+=30){g.beginPath();g.moveTo(0,py(i));g.lineTo(W,py(i));g.stroke()}
  const S=sunAt(BASE.lat,BASE.lon);g.fillStyle="rgba(0,5,15,.55)";g.beginPath();
  for(let la=-89;la<90;la+=2)for(let lo=-179;lo<180;lo+=2)if(Math.sin(S.dec)*Math.sin(la*D2R)+Math.cos(S.dec)*Math.cos(la*D2R)*Math.cos(lo*D2R-S.sl)<0)g.rect(px(lo-1),py(la+1),W/180+.5,H/90+.5);g.fill();
  WX.act.forEach(s=>{const d=s[3]/59.16;g.fillStyle="rgba(255,140,40,.4)";g.beginPath();g.ellipse(px(s[1]),py(s[2]),Math.min(W/2,d/360*W/Math.max(.2,Math.cos(s[2]*D2R))),d/180*H,0,0,7);g.fill()});
  pts.forEach(p=>{g.fillStyle=p[3];g.beginPath();g.arc(px(p[1]),py(p[0]),4,0,7);g.fill();g.fillStyle="#fff";g.font="9px Arial";g.fillText(p[2],px(p[1])+6,py(p[0])+3)})})();
 c.onclick=e=>{const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*W,y=(e.clientY-r.top)/r.height*H;let b=null,bd=18;pts.forEach(p=>{const q=Math.hypot(px(p[1])-x,py(p[0])-y);if(q<bd){bd=q;b=p}});
  const la=b?b[0]:+(90-y/H*180).toFixed(2),lo=b?b[1]:+(x/W*360-180).toFixed(2);
  $("gi").innerHTML=(b?`<strong style='color:#69eaff'>${b[2]}</strong> (${la}°, ${lo}°E)<br>${b[4]}`:`<strong style='color:#69eaff'>${la}°, ${lo}°E</strong> · ${WX.act.some(s=>marsKm(la,lo,s[2],s[1])<s[3])?"inside a dust storm now":"no storm here now"} · ${stormRisk(la,lo).toFixed(1)} storms/Mars year (MDAD)`)+"<br>"+flyB(la,lo,"VIEW + SURVEY IN 3D")+(b?trvB(b[2]):"")}}
// ---- 3D orbit map link: 3d map/mars3d.html (its "Mission control bridge" is the other end)
const W3=$("world");let m3ok=false,m3q=[];
// Before the map is ready only one-shot commands queue; storms, clock and sunlight are resent on ready
function to3d(m){m={mc:1,...m};if(m3ok)W3.contentWindow.postMessage(m,"*");else if(/^(sleep|mode|fly|track)$/.test(m.type))m3q.push(m)}
const sendClock=()=>to3d({type:"clock",t:M.sim,rate:G.paused?0:M.spd}),envUpd=()=>to3d({type:"env",sun:sunAt(BASE.lat,BASE.lon).vec});
addEventListener("message",({data:d})=>{if(!d)return;if(d.loc3d&&d.type=="exit")return travelEnd();if(!d.mars3d)return;
 if(d.type=="ready"){m3ok=true;WX.key="";wxUpd();sendClock();envUpd();to3d({type:"mode",spin:!G.started,lat:BASE.lat,lon:BASE.lon});m3q.splice(0).forEach(to3d)}
 else if(d.type=="close")escKey();else if(d.type=="travel")travel(d.id,d.land)});
// ---- the outland game (locations3d.html), loaded once: main-menu backdrop ("bg"), full screen ("play") or hidden ("");
// the Cesium map stops rendering whenever it is covered
const LOC=document.createElement("iframe");let LOCok=false,LOCq=null;LOC.id="loc3d";LOC.title="OUTLAND: famous Mars locations in 3D";LOC.src="locations3d.html?bg=1";document.body.append(LOC);
const toLoc=m=>{m={loc3d:1,...m};if(LOCok)LOC.contentWindow.postMessage(m,"*");else LOCq=m};
LOC.onload=()=>{LOCok=true;if(LOCq)LOC.contentWindow.postMessage(LOCq,"*")};
function locMode(k){LOC.className=k;to3d({type:"sleep",on:!!k});if(k!="play")toLoc({type:k?"bg":"hide"})}
const has3d=()=>{try{return!!localStorage.getItem("outland_real1")}catch(e){return false}};
const freeze=()=>{closeM();hideMenus();G.paused=true;sendClock();locMode("play");LOC.focus()};
// Create New / Continue: the outland game (it keeps its own save); TRAVEL: the game at famous location id
function play3d(load){freeze();toLoc({type:"start",load})}
function travel(id,land){if(!SITES3D.some(t=>t.id==id))return;freeze();toLoc({type:"go",id,sim:M.sim,land})}
// Back from the game: to the orbit map if it was open, otherwise the main menu
function travelEnd(){focus();if(!G.started)return showMenu("main");locMode("");G.menu=false;G.paused=false;sendClock()}
// ---- menus (outland's): main = logo + big list over the spinning outland world; pause = orange box over the orbit map
function startMap(){G.started=true;G.menu=false;G.paused=false;hideMenus();locMode("");to3d({type:"mode",spin:false,lat:BASE.lat,lon:BASE.lon});sendClock()}
function resume(){G.paused=false;G.menu=false;hideMenus();sendClock()}
function escKey(){if(mb.classList.contains("open"))return closeM();if(!G.started)return;if(G.menu)resume();else showMenu("pause")}
const hideMenus=()=>{$("menu").classList.add("off");$("pause").classList.add("off");document.body.classList.remove("mm")};
const credits=()=>openM("ABOUT GAME",`<div class="card">OUTLAND · M.A.R.S. Create New walks you onto real Mars: NASA MOLA terrain, rovers where NASA last tracked them, real dust storms (MDAD, Battalio &amp; Wang 2021). Mission Control opens the orbit map: Cesium Mars 3D Tiles, NASA Mars Trek imagery, NASA 3D Resources models, real orbits of moons and orbiters.</div>`),
 ex=()=>openM("EXIT",`<div class="card">Close this tab to exit. Progress autosaves in this browser.</div>`),

function showMenu(m){G.menu=true;G.paused=true;sendClock();const p=m=="pause";if(!p)G.started=false;
